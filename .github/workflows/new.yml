name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '**/Makefile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 核心修改点1：将你的源码 checkout 到一个叫 my-plugin 的独立文件夹中，防止被覆盖
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: my-plugin

      - name: Setup OpenWrt SDK & Build
        run: |
          # 1. 安装解压依赖
          sudo apt-get update && sudo apt-get install -y zstd

          # 2. 下载并解压 SDK 到当前根目录
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -q $SDK_URL -O sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst --strip-components=1
          rm sdk.tar.zst

          # 3. 将你的插件源码移动到 SDK 的 package 目录内
          mv my-plugin package/custom-app

          # 4. 更新并安装 feed 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 5. 动态查找并编译所有合法的插件
          make defconfig
          
          echo "=== 开始动态编译插件 ==="
          find package/custom-app -name "Makefile" -type f | while read -r makefile_path; do
            # 校验是否为标准的 OpenWrt 插件 Makefile
            if grep -q "include \$(TOPDIR)/rules.mk" "$makefile_path"; then
              pkg_dir=$(dirname "$makefile_path")
              echo "=== 发现插件目录: $pkg_dir，正在执行编译 ==="
              make "$pkg_dir/compile" V=s
            fi
          done

      - name: Organize Target APK Files Only
        run: |
          mkdir -p release_files
          # 提取编译生成的 apk
          find bin/packages/ -type f \( -name "*bandix*.apk" -o -name "*luci*.apk" \) -exec cp {} release_files/ \;
          
          echo "=== 过滤后的待上传附件清单 ==="
          ls -lh release_files/

      - name: Generate Release Tag
        id: tag
        run: |
          if [ -z "${{ github.ref_name }}" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="v25.12-$(date +'%Y%m%d-%H%M')"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "OpenWrt Packages (${{ steps.tag.outputs.tag_name }})"
          body: |
            ### 编译说明
            - 适用系统：OpenWrt SNAPSHOT (包管理器：APK)
            - 架构：x86_64
            - 包含文件：核心程序包及 LuCI 界面包 (.apk)
          draft: false
          prerelease: false
          files: release_files/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
